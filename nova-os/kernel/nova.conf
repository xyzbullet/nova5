# NovaOS kernel configuration overlay.
# Build this from a FreeBSD source checkout with:
#   make KERNCONF=../nova-os/kernel/nova.conf buildkernel

include GENERIC

ident NOVA

# Product identity and diagnostics. These options are intentionally small;
# performance tuning belongs in measured, reviewable changes.
options NOVA_KERNEL
options KDB
options DDB

# Desktop workload support.
options PREEMPTION
options RACCT
options RCTL

# Keep common desktop hardware available in the first developer image.
device          sound
device          ums
device          usbhid